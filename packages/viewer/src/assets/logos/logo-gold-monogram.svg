<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Studio Lighting -->
    <radialGradient id="studio-rim" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#221e1a" />
      <stop offset="35%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <!-- 24K Brushed Gold Primary Ingot -->
    <linearGradient id="gold-ingot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="15%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="48%" stop-color="#D97706" />
      <stop offset="65%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Reverse Bevel Gold (Creates realistic 3D bevel edge lighting) -->
    <linearGradient id="gold-bevel" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Dark Titanium Recessed Panel -->
    <linearGradient id="recessed-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#10121a" />
      <stop offset="100%" stop-color="#1a1c26" />
    </linearGradient>

    <!-- Diagonal Studio Gleam Streak -->
    <linearGradient id="studio-gleam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Heavy Realistic Cast Shadow -->
    <filter id="physical-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Metallic Specular Lighting Filter -->
    <filter id="metallic-spec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.4" specularExponent="40" lighting-color="#FFFBEB" result="spec">
        <feDistantLight azimuth="225" elevation="55" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="over" />
    </filter>
  </defs>

  <!-- 1. Luxury Chamfered Hex-Tile Plinth -->
  <g filter="url(#physical-shadow)">
    <!-- Base Chamfer Ingot Plate -->
    <path d="M 120,32 L 392,32 L 480,120 L 480,392 L 392,480 L 120,480 L 32,392 L 32,120 Z" 
          fill="url(#studio-rim)" 
          stroke="url(#gold-bevel)" 
          stroke-width="3" />

    <!-- Recessed Inner Bed -->
    <path d="M 130,50 L 382,50 L 462,130 L 462,382 L 382,462 L 130,462 L 50,382 L 50,130 Z" 
          fill="url(#recessed-panel)" 
          stroke="rgba(0,0,0,0.8)" 
          stroke-width="4" />

    <!-- Corner Micro-Rivet Precision Screws (Luxury Watch Aesthetics) -->
    <circle cx="72" cy="72" r="5" fill="#332B1A" stroke="#78350F" stroke-width="1.5" />
    <line x1="69" y1="72" x2="75" y2="72" stroke="#FDE68A" stroke-width="1" />
    
    <circle cx="440" cy="72" r="5" fill="#332B1A" stroke="#78350F" stroke-width="1.5" />
    <line x1="437" y1="72" x2="443" y2="72" stroke="#FDE68A" stroke-width="1" />
    
    <circle cx="72" cy="440" r="5" fill="#332B1A" stroke="#78350F" stroke-width="1.5" />
    <line x1="69" y1="440" x2="75" y2="440" stroke="#FDE68A" stroke-width="1" />
    
    <circle cx="440" cy="440" r="5" fill="#332B1A" stroke="#78350F" stroke-width="1.5" />
    <line x1="437" y1="440" x2="443" y2="440" stroke="#FDE68A" stroke-width="1" />
  </g>

  <!-- 2. The 3D Raised Interlocking 'B' & 'S' Monogram -->
  <g filter="url(#physical-shadow)">
    <!-- Monogram Extrusion Shadow Layer -->
    <path d="M 172,138 L 272,138 C 322,138 352,168 352,208 C 352,236 332,254 308,260 C 342,268 368,296 368,336 C 368,382 328,408 272,408 L 172,408 Z" 
          fill="#1C0F05" 
          transform="translate(0, 10)" />

    <!-- Primary 'B' Structure (The "Bro" Anchor) in Solid 24K Gold -->
    <path d="M 160,128 L 265,128 C 315,128 348,156 348,198 C 348,226 328,244 302,252 C 336,258 362,286 362,328 C 362,374 322,402 265,402 L 160,402 Z 
             M 218,176 L 218,232 L 260,232 C 282,232 296,220 296,204 C 296,188 282,176 260,176 Z 
             M 218,284 L 218,354 L 268,354 C 292,354 308,340 308,319 C 308,298 292,284 268,284 Z" 
          fill="url(#gold-ingot)" 
          stroke="url(#gold-bevel)" 
          stroke-width="3.5" 
          filter="url(#metallic-spec)" />

    <!-- The 'S' Weave ("Sync" Wave) Interlocked Through The Center -->
    <path d="M 295,190 C 325,190 355,205 355,232 C 355,258 310,270 270,285 C 225,302 185,320 185,355 C 185,395 230,412 280,412 C 310,412 340,400 355,385" 
          fill="none" 
          stroke="url(#gold-ingot)" 
          stroke-width="26" 
          stroke-linecap="round" 
          filter="url(#metallic-spec)" />

    <!-- Center Playback Spark (Carved inside the loop) -->
    <polygon points="248,292 284,319 248,346" fill="#FFFBEB" />
    <polygon points="248,292 284,319 248,319" fill="#FFFFFF" />
    <polygon points="248,319 284,319 248,346" fill="#F59E0B" />
  </g>

  <!-- 3. Dynamic Studio Light Flare Overlay -->
  <rect x="50" y="50" width="412" height="412" fill="url(#studio-gleam)" pointer-events="none" />
</svg>
