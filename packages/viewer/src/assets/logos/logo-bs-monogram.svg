<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Lighting -->
    <radialGradient id="bs-bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241a15" />
      <stop offset="40%" stop-color="#101118" />
      <stop offset="100%" stop-color="#050609" />
    </radialGradient>

    <!-- 24K Amber Gold Shading for "B" (Bro) -->
    <linearGradient id="b-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="16%" stop-color="#FDE68A" />
      <stop offset="38%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Sunset Coral Ruby Shading for "S" (Sync) -->
    <linearGradient id="s-ruby-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="20%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="78%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <!-- Bevel 3D Rim Gradient -->
    <linearGradient id="bevel-rim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FCD34D" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#F43F5E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>

    <!-- Specular Flare Streak -->
    <linearGradient id="flare-gleam" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="47%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="53%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Photorealistic Drop Shadow Filter -->
    <filter id="bs-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Specular Lighting Shimmer -->
    <filter id="bs-specular" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="38" lighting-color="#FFFBEB" result="spec">
        <fePointLight x="160" y="120" z="240" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="over" />
    </filter>

    <!-- Volumetric Glow Bloom -->
    <filter id="bs-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b1" />
      <feGaussianBlur stdDeviation="28" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Obsidian Squircle Plinth -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bs-bg-glow)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />

  <!-- Ambient Light Reflection on Plinth -->
  <circle cx="210" cy="240" r="130" fill="#F59E0B" opacity="0.12" filter="url(#bs-bloom)" />
  <circle cx="310" cy="280" r="130" fill="#F43F5E" opacity="0.10" filter="url(#bs-bloom)" />

  <!-- 2. The Integrated 'B' & 'S' Monogram (BroSync) -->
  <g filter="url(#bs-shadow)">
    
    <!-- Heavy 3D Extruded Base Cast -->
    <g transform="translate(0, 8)" opacity="0.4" fill="#000000">
      <!-- 'B' Backbone -->
      <rect x="132" y="118" width="52" height="276" rx="26" />
      <!-- 'B' Top Loop -->
      <path d="M 158,118 L 260,118 C 305,118 335,142 335,182 C 335,220 305,242 260,242 L 158,242 Z" />
      <!-- 'S' Weave -->
      <path d="M 330,195 C 365,210 380,240 380,275 C 380,335 325,394 240,394 C 185,394 148,365 140,345" stroke="#000000" stroke-width="52" fill="none" stroke-linecap="round" />
    </g>

    <!-- 'B' (Bro) Backbone Pillar - Solid Polished Gold Ingot -->
    <rect x="132" y="110" width="50" height="272" rx="25" fill="url(#b-gold-grad)" stroke="url(#bevel-rim)" stroke-width="2.5" filter="url(#bs-specular)" />

    <!-- 'B' Upper Loop (Bro Header) -->
    <path d="M 157,110 L 255,110 C 298,110 328,134 328,172 C 328,210 298,232 255,232 L 157,232" 
          fill="none" 
          stroke="url(#b-gold-grad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#bs-specular)" />

    <!-- 'S' (Sync) Lower Kinetic Loop - Interwoven into B in Sunset Ruby -->
    <path d="M 235,232 C 290,232 355,246 355,296 C 355,348 298,382 235,382 C 185,382 152,358 140,338" 
          fill="none" 
          stroke="url(#s-ruby-grad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          filter="url(#bs-specular)" />

    <!-- 'S' Upper Hook Weave (Crossing Over B's center waist) -->
    <path d="M 315,165 C 342,185 358,212 358,248 C 358,280 325,302 275,315" 
          fill="none" 
          stroke="url(#s-ruby-grad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          filter="url(#bs-specular)" 
          opacity="0.95" />

    <!-- Specular Light Ribbons (Glossy Sheen along top of B and S) -->
    <path d="M 160,116 L 250,116 C 285,116 312,134 312,165" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.75" />

    <path d="M 245,240 C 290,240 342,252 342,290" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.6" />

    <path d="M 144,128 L 144,360" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.5" />
  </g>

  <!-- 3. Central Playback Jewel (Derived from the 'B' negative space) -->
  <g filter="url(#bs-shadow)">
    <polygon points="214,152 260,178 214,204" fill="#1C0F05" opacity="0.6" />
    <polygon points="212,150 258,176 212,202" fill="url(#b-gold-grad)" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="212,150 258,176 212,176" fill="#FFFFFF" opacity="0.6" />
    <!-- Sparkle core -->
    <circle cx="225" cy="170" r="3" fill="#FFFFFF" filter="url(#bs-bloom)" />
  </g>

  <!-- 4. Subtitle Typography Badge "BROSYNC" at Bottom -->
  <g transform="translate(256, 436)">
    <rect x="-85" y="-14" width="170" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="0" y="3" font-family="'JetBrains Mono', 'Inter', monospace" font-size="12" font-weight="700" letter-spacing="4" fill="#FDE68A" text-anchor="middle">
      BROSYNC
    </text>
  </g>

  <!-- 5. Studio Gleam Glint Overlay -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#flare-gleam)" pointer-events="none" />
</svg>
