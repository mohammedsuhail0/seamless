<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1613" />
      <stop offset="45%" stop-color="#0d0e14" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Torus Left - Molten Amber 3D Tube -->
    <linearGradient id="amber-tube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CC" />
      <stop offset="18%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="78%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#2D1204" />
    </linearGradient>

    <!-- Torus Right - Sunset Ruby 3D Tube -->
    <linearGradient id="rose-tube" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="22%" stop-color="#FB7185" />
      <stop offset="55%" stop-color="#E11D48" />
      <stop offset="82%" stop-color="#881337" />
      <stop offset="100%" stop-color="#330612" />
    </linearGradient>

    <!-- Specular Highlight Ribbon -->
    <linearGradient id="specular-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Play Beacon 3D Crystal -->
    <linearGradient id="crystal-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Deep Ambient Occlusion Shadow Filter -->
    <filter id="photoreal-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <!-- Volumetric Bloom Filter -->
    <filter id="volumetric-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Raytraced Specular Bevel Filter -->
    <filter id="specular-bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.2" specularExponent="35" lighting-color="#FFFFFF" result="spec">
        <fePointLight x="180" y="140" z="220" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="over" />
    </filter>
  </defs>

  <!-- 1. Deep Obsidian Squircle Plinth (Looks like a real solid tile) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-glow)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Subtle Inset Edge Bevel on Plinth -->
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  
  <!-- Ambient Core Light Dome -->
  <circle cx="256" cy="256" r="140" fill="#F59E0B" opacity="0.12" filter="url(#volumetric-bloom)" />
  <circle cx="210" cy="256" r="90" fill="#FBBF24" opacity="0.1" filter="url(#volumetric-bloom)" />
  <circle cx="302" cy="256" r="90" fill="#F43F5E" opacity="0.09" filter="url(#volumetric-bloom)" />

  <!-- 2. The Interlocking 3D Toruses (Rendered with drop shadow & physical depth) -->
  <g filter="url(#photoreal-shadow)">
    
    <!-- Torus Left: Molten Amber Loop (Back Arc) -->
    <path d="M 210,170 C 150,170 100,208 100,256 C 100,304 150,342 210,342 C 265,342 295,310 310,285" 
          fill="none" 
          stroke="url(#amber-tube)" 
          stroke-width="52" 
          stroke-linecap="round" 
          filter="url(#specular-bevel)" />

    <!-- Torus Right: Sunset Ruby Loop (Full Fluid Geometry) -->
    <path d="M 302,342 C 362,342 412,304 412,256 C 412,208 362,170 302,170 C 247,170 217,202 202,227" 
          fill="none" 
          stroke="url(#rose-tube)" 
          stroke-width="52" 
          stroke-linecap="round" 
          filter="url(#specular-bevel)" />

    <!-- Torus Left: Front Weave (Interlocking Overlap) -->
    <path d="M 245,216 C 265,190 288,170 302,170 C 330,170 365,188 385,215" 
          fill="none" 
          stroke="url(#amber-tube)" 
          stroke-width="50" 
          stroke-linecap="round" 
          filter="url(#specular-bevel)" 
          opacity="0.96" />

    <!-- Upper Specular Raytraced Highlights (Glossy Glass Sheen) -->
    <path d="M 200,152 C 155,152 118,185 118,228" 
          fill="none" 
          stroke="url(#specular-light)" 
          stroke-width="8" 
          stroke-linecap="round" />

    <path d="M 312,152 C 357,152 394,185 394,228" 
          fill="none" 
          stroke="url(#specular-light)" 
          stroke-width="8" 
          stroke-linecap="round" />

    <!-- Bottom Secondary Ground Reflection Highlight -->
    <path d="M 170,356 C 205,356 240,336 260,310" 
          fill="none" 
          stroke="rgba(255,255,255,0.2)" 
          stroke-width="4" 
          stroke-linecap="round" />
  </g>

  <!-- 3. Center Faceted Play Jewel (The Real-Time Media Core) -->
  <g filter="url(#photoreal-shadow)">
    <!-- Jewel Outer Rim Bevel -->
    <polygon points="240,218 296,256 240,294" fill="#78350F" opacity="0.7" />
    
    <!-- Facet Top -->
    <polygon points="242,222 292,256 242,256" fill="url(#crystal-face)" />
    
    <!-- Facet Bottom (Darker refractive angle) -->
    <polygon points="242,256 292,256 242,290" fill="#D97706" />

    <!-- Razor Center Specular Spark -->
    <circle cx="248" cy="242" r="3" fill="#FFFFFF" filter="url(#volumetric-bloom)" />
    <path d="M 243,242 L 253,242 M 248,237 L 248,247" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- 4. Twin Orbit Satellites (Friends Synchronized) -->
  <!-- Left Amber Satellite -->
  <circle cx="120" cy="225" r="10" fill="#FBBF24" filter="url(#volumetric-bloom)" />
  <circle cx="120" cy="225" r="5" fill="#FFFFFF" />

  <!-- Right Rose Satellite -->
  <circle cx="392" cy="287" r="10" fill="#FB7185" filter="url(#volumetric-bloom)" />
  <circle cx="392" cy="287" r="5" fill="#FFFFFF" />

  <!-- Rim Glow Arc along Top Perimeter -->
  <path d="M 120,40 Q 256,18 392,40" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round" />
</svg>
