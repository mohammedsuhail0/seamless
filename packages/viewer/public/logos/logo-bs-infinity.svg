<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Studio Void -->
    <radialGradient id="inf-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1822" />
      <stop offset="42%" stop-color="#0f1018" />
      <stop offset="100%" stop-color="#05060a" />
    </radialGradient>

    <!-- Continuous 3D Tube Gradient (b to s transition) -->
    <linearGradient id="inf-tube-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="14%" stop-color="#FBBF24" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#FB7185" />
      <stop offset="85%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Specular White Sheen -->
    <linearGradient id="inf-spec-sheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Ambient Occlusion Shadow -->
    <filter id="inf-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Raytraced Tube Bevel -->
    <filter id="inf-bevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="36" lighting-color="#FFFFFF" result="spec">
        <fePointLight x="180" y="130" z="230" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="over" />
    </filter>

    <!-- Neon Bloom -->
    <filter id="inf-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b1" />
      <feGaussianBlur stdDeviation="32" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Obsidian Tile Plinth -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#inf-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />

  <!-- Ambient Internal Bloom Field -->
  <circle cx="190" cy="256" r="120" fill="#F59E0B" opacity="0.14" filter="url(#inf-bloom)" />
  <circle cx="330" cy="256" r="120" fill="#F43F5E" opacity="0.12" filter="url(#inf-bloom)" />

  <!-- 2. The Unbroken 'b' & 's' Ligature Ribbon -->
  <g filter="url(#inf-shadow)">
    
    <!-- Cast Shadow Pass -->
    <g transform="translate(0, 10)" opacity="0.4" fill="none" stroke="#000000" stroke-width="50" stroke-linecap="round">
      <path d="M 148,110 L 148,320 C 148,368 200,368 236,320 C 272,272 300,240 338,240 C 378,240 398,272 398,305 C 398,355 345,365 315,365" />
    </g>

    <!-- 'b' Ascender Stem (Left Pillar) -->
    <path d="M 148,110 L 148,320 C 148,368 200,368 238,322 C 274,276 302,240 342,240 C 382,240 404,270 404,305 C 404,355 352,365 322,365" 
          fill="none" 
          stroke="url(#inf-tube-grad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#inf-bevel)" />

    <!-- 'b' Lower Loop (Bro Circle that flows up) -->
    <path d="M 148,250 C 148,205 195,205 238,250 C 276,290 300,320 340,320 C 378,320 398,295 398,265 C 398,215 348,205 318,205" 
          fill="none" 
          stroke="url(#inf-tube-grad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#inf-bevel)" 
          opacity="0.96" />

    <!-- Specular 3D Reflection Strip along the 'b' stem and curves -->
    <path d="M 140,120 L 140,320" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.8" />

    <path d="M 154,222 C 178,210 205,214 226,236" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.7" />

    <path d="M 326,212 C 362,212 390,230 390,260" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.6" />
  </g>

  <!-- 3. Central Media Beacon in the Crossing Node -->
  <g filter="url(#inf-bloom)">
    <circle cx="260" cy="275" r="16" fill="url(#inf-tube-grad)" />
    <!-- Play Triangle carved in center -->
    <polygon points="256,268 268,275 256,282" fill="#FFFFFF" />
  </g>

  <!-- 4. Twin Sync Satellite Orbs (Brothers in Sync) -->
  <circle cx="190" cy="278" r="9" fill="#FBBF24" filter="url(#inf-bloom)" />
  <circle cx="190" cy="278" r="4.5" fill="#FFFFFF" />

  <circle cx="350" cy="278" r="9" fill="#FB7185" filter="url(#inf-bloom)" />
  <circle cx="350" cy="278" r="4.5" fill="#FFFFFF" />

  <!-- 5. Wordmark Micro-Tag at Bottom -->
  <g transform="translate(256, 436)">
    <rect x="-92" y="-14" width="184" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="0" y="3" font-family="'JetBrains Mono', 'Inter', monospace" font-size="11" font-weight="700" letter-spacing="4" fill="#FDE68A" text-anchor="middle">
      BRO • SYNC
    </text>
  </g>
</svg>
