name: Build BroSync Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Web Application
        run: |
          npm run build -w packages/shared
          npm run build -w packages/viewer
          npm run android:sync -w packages/viewer

      - name: Grant Execute Permission for Gradlew
        run: chmod +x packages/viewer/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd packages/viewer/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BroSync-Android-Debug-APK
          path: packages/viewer/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
