name: Keep BroSync API Warm

on:
  schedule:
    # Trigger every 10 minutes (Render spins down after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Warmup BroSync Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping BroSync Health Endpoint
        run: |
          curl -s --fail --max-time 60 https://browsync-api.onrender.com/health || true
